services:
  tradingview-mcp:
    build: .
    image: mjasion/tradingview-mcp:latest
    container_name: tradingview-mcp
    ports:
      - "8080:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      # Persist Yahoo / SEC / commodity cache across container restarts.
      # Without this the JSON cache lives only inside the container's writable
      # layer and is wiped by `docker compose down`.
      - TRADINGVIEW_MCP_CACHE_DIR=/var/cache/tradingview-mcp
    # Webshare proxy credentials (PROXY_USERNAME_PREFIX / PROXY_PASSWORD, etc.)
    # live in .env (gitignored — see .env.example). required: false keeps the
    # stack booting proxy-less until you create .env. Without this block the
    # container never sees PROXY_* and every Yahoo call egresses on the host IP
    # — exactly the IP Yahoo 429-bans.
    env_file:
      - path: .env
        required: true
    volumes:
      - cache:/var/cache/tradingview-mcp
    labels:
      - autoheal=true
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python -c "import urllib.request, json; \
          r=urllib.request.Request('http://localhost:8000/mcp', method='POST', \
          headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'}, \
          data=json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2024-11-05','capabilities':{},'clientInfo':{'name':'hc','version':'1'}}}).encode()); \
          urllib.request.urlopen(r, timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  # Docker's default bridge pool (172.16.0.0/12) overlapped the IPsec/LAN
  # subnet 172.20.0.0/16 where the self-hosted egress proxies live (e.g.
  # oci2-local.mjasion.dev -> 172.20.1.37). A container at 172.20.0.x then
  # treats 172.20.1.37 as on-link, ARPs for it on the docker bridge, and fails
  # with "No route to host" — it never hands the packet to the host's IPsec
  # tunnel. Pin the bridge to a subnet that can't overlap the tunnel. If
  # 10.89.0.0/24 also collides with your LAN/VPN, pick any other free /24.
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  cache:
